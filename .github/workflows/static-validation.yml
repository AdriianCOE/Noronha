name: Static validation

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy Pillow
      - run: python -m py_compile source/scripts/*.py
      - run: python -m unittest discover -s source/scripts -p "test_*.py"
      - run: python source/scripts/audit_surfaces.py --strict
      - run: python source/scripts/audit_sounds.py
      - run: git grep -n -- 'P:\\' -- '*.cpp' '*.hpp' '*.c' '*.py' '*.ps1' && exit 1 || exit 0
