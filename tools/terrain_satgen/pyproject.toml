[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain-satgen"
version = "0.1.0"
description = "Read-only terrain satellite input inspector for DayZ terrain projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10",
]

[project.scripts]
terrainsat = "terrainsat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
