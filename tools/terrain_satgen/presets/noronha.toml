[world]
size_m = 10240

[inputs]
layers = "P:/Noronha/source/layers.cfg"
height = "P:/Noronha/source/QGIS/gtt_heightmap.asc"
satellite = "P:/Noronha_Workspace/assets-src/terrain/gtt_satmap.bmp"
mask = "P:/Noronha_Workspace/assets-src/terrain/gtt_mask_osm.bmp"
vanilla_root = "P:/"

[mask]
unknown_color_policy = "error"
tile_rows = 256

# Terrain Builder compatibility aliases are semantic declarations only. Strict
# inspect remains the default; --tb-compat is required to activate them.
[mask.color_aliases]
"255,175,23" = "cp_gravel"
"254,29,191" = "en_soil"
"251,227,38" = "en_stubble"
"87,86,86" = "cp_concrete2"

[terrain_builder]
tile_texture_px = 512
core_stride_px = 480
border_px = 16
actual_shared_overlap_px = 32
tiles_per_row = 22
material_limit = 4

# Real previews remain read-only regional experiments. These recipes are not a
# Terrain Builder layer configuration and never rewrite the source mask.
[real_preview]
world_seed = "noronha-real-preview-v1"
structure_blur_radius_px = 12

[real_preview.variants.subtle]
structure_weight = 0.55
detail_weight = 0.35
recipe_weight = 0.10

[real_preview.variants.balanced]
structure_weight = 0.45
detail_weight = 0.15
recipe_weight = 0.40

[real_preview.variants.authored]
structure_weight = 0.32
detail_weight = 0.05
recipe_weight = 0.63

