[world]
size_m = 10240

[inputs]
layers = "P:/Noronha/source/layers.cfg"
height = "P:/Noronha/source/QGIS/gtt_heightmap.asc"
satellite = "P:/Noronha_Workspace/assets-src/terrain/gtt_satmap.bmp"
mask = "P:/Noronha_Workspace/assets-src/terrain/gtt_mask_osm.bmp"
vanilla_root = "P:/"

[mask]
unknown_color_policy = "error"
tile_rows = 256

# Terrain Builder compatibility aliases are semantic declarations only. Strict
# inspect remains the default; --tb-compat is required to activate them.
[mask.color_aliases]
"255,175,23" = "cp_gravel"
"254,29,191" = "en_soil"
"251,227,38" = "en_stubble"
"87,86,86" = "cp_concrete2"

[terrain_builder]
tile_texture_px = 512
core_stride_px = 480
border_px = 16
actual_shared_overlap_px = 32
tiles_per_row = 22
material_limit = 4

# Real previews remain read-only regional experiments. Recipes modulate the
# source satellite; they are not a Terrain Builder layer configuration and
# never rewrite the source mask.
[real_preview]
world_seed = "noronha-real-preview-v31"
structure_blur_radius_px = 12

[real_preview.variants.subtle]
detail_preservation = 0.88
modulation_strength = 0.25

[real_preview.variants.balanced]
detail_preservation = 0.72
modulation_strength = 0.55

[real_preview.variants.authored]
detail_preservation = 0.40
modulation_strength = 0.88

# The Mapframe lower-left and ASC origins are the confirmed ground truth.
# The source distribution has water concentrated around -10 m; the 4 m band
# avoids silently treating an arbitrary 0 m sample as the whole coast rule.
[real_preview.height_context]
world_x_origin_m = 200000.0
world_y_origin_m = 0.0
water_level_m = -2.0
land_level_m = 2.0
water_original_preservation = 0.92
coast_original_preservation = 0.58
water_modulation_cap = 0.02
coast_modulation_cap = 0.10

[real_preview.recipes.en_grass2]
brightness_offset = -0.018
saturation_adjustment = 0.025
warmth_bias = 0.008
channel_bias = [0.002, 0.000, -0.002]
macro_strength = 0.075
medium_strength = 0.040
local_strength = 0.010
preservation_strength = 0.62
feather_width_m = 18.0

[real_preview.recipes.en_forest_con]
brightness_offset = -0.030
saturation_adjustment = -0.015
warmth_bias = 0.004
channel_bias = [-0.002, 0.003, -0.001]
macro_strength = 0.055
medium_strength = 0.035
local_strength = 0.010
preservation_strength = 0.64
feather_width_m = 24.0

[real_preview.recipes.en_soil]
brightness_offset = -0.022
saturation_adjustment = -0.008
warmth_bias = 0.035
channel_bias = [0.006, -0.002, -0.006]
macro_strength = 0.060
medium_strength = 0.035
local_strength = 0.008
preservation_strength = 0.60
feather_width_m = 12.0

[real_preview.recipes.en_stubble]
brightness_offset = -0.010
saturation_adjustment = -0.010
warmth_bias = 0.025
channel_bias = [0.004, 0.001, -0.005]
macro_strength = 0.070
medium_strength = 0.040
local_strength = 0.010
preservation_strength = 0.58
feather_width_m = 12.0

[real_preview.recipes.cp_gravel]
brightness_offset = -0.012
saturation_adjustment = -0.025
warmth_bias = 0.010
channel_bias = [0.002, 0.000, -0.002]
macro_strength = 0.030
medium_strength = 0.018
local_strength = 0.004
preservation_strength = 0.85
feather_width_m = 3.0

[real_preview.recipes.cp_concrete2]
brightness_offset = -0.008
saturation_adjustment = -0.030
warmth_bias = 0.000
channel_bias = [0.000, 0.000, 0.000]
macro_strength = 0.015
medium_strength = 0.010
